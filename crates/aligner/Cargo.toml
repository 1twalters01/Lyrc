[package]
name = "aligner"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
futures = "0.3.33"
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
tokio = { version = "1.53.1", features = ["full"] }
