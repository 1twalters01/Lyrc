[package]
name = "lyrc_core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
tokio = { version = "1.52.3", features = ["sync", "macros", "rt-multi-thread"] }
uuid = { version = "1.24.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
zbus = { version = "5.17.0", features = ["tokio"] }

configuration = { path = "../../crates/configuration/" }
translator = { path = "../translator/" }
aligner = { path = "../aligner/" }
downloader = { path = "../downloader/" }
synchronizer = { path = "../synchronizer/" }
subtitles = { path = "../subtitles/" }
mpris = { path = "../mpris/" }
